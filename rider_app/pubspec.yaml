name: rider_app
description: MartFood rider (delivery partner) application — frontend mock.
publish_to: 'none'
version: 1.0.0+7

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_widgets:
    path: ../shared_widgets
  go_router: ^14.6.2
  flutter_screenutil: ^5.9.0
  lucide_icons_flutter: ^3.0.0
  cached_network_image: ^3.3.0
  flutter_riverpod: ^2.6.1
  equatable: ^2.0.5
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.4.11
  firebase_storage: ^12.3.7
  http: ^1.2.2
  connectivity_plus: ^6.0.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1
  google_sign_in: ^6.1.6
  shared_preferences: ^2.2.3
  geolocator: ^12.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "lib/assets/martffood_rider.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "lib/assets/martffood_rider.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - lib/assets/
    - lib/assets/home/
    - lib/assets/onboarding/
    - lib/assets/icon/dark/
    - lib/assets/icon/light/
    - lib/assets/icon/bottom_nav_bar/grey/
    - lib/assets/icon/bottom_nav_bar/purple/


